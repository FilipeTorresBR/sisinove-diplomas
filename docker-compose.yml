services:
  db:
    image: postgres:16-alpine
    container_name: sisinove_shared_db
    restart: always # Garante que volte após quedas de energia
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Remova o mapeamento de portas externas ou use 127.0.0.1
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- SISDIP ---
  sisdip_backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/sisdip?schema=public
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://sisdip.sisinove.com.br
    ports:
      - "127.0.0.1:4001:4001"

  sisdip_frontend:
    build: ./frontend
    restart: always
    environment:
      VITE_API_URL: https://sisdip.sisinove.com.br/api
    ports:
      - "127.0.0.1:8081:80"

  # --- ISO ---
  iso_backend:
    build: ../sisinove-iso/backend
    restart: always
    env_file: ../sisinove-iso/.env
    volumes:
      - ../sisinove-iso/backend/uploads:/app/uploads:Z
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/sisinove_iso?schema=public
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"

  iso_frontend:
    build:
      context: ../sisinove-iso/frontend
      args:
        VITE_API_URL: https://iso.sisinove.com.br/api
    restart: always
    links:
      - iso_backend:backend
    ports:
      - "127.0.0.1:8082:80"

volumes:
  postgres_data:
